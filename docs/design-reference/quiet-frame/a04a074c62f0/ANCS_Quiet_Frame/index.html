'use strict';
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',link:'<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1" transform="translate(1 -1) scale(.9)"/>',file:'<path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z"/><path d="M13 3v7h7M8 14h8M8 17h6"/>',text:'<path d="M5 5h14M12 5v14M8 19h8"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2ZM3 10h18"/>',voice:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',box:'<path d="m12 3 9 5-9 5-9-5Zm-9 5v9l9 5 9-5V8M12 13v9M7 5l9 5"/>',settings:'<path d="M12 3 9 4l-2-1-3 4 1 2-2 3 2 3-1 2 3 4 2-1 3 1 3-1 2 1 3-4-1-2 2-3-2-3 1-2-3-4-2 1Z"/><circle cx="12" cy="12" r="3"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v.1"/>',check:'<path d="m5 12 4 4L19 6"/>',shield:'<path d="m12 2 8 4v7c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',upload:'<path d="M12 15V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>',unlock:'<rect const icon=(n,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.grid}</svg>`;
const mark=()=>`<span class="logomark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/><path d="m10 8 6 4-6 4Z" fill="currentColor" stroke="none"/></svg></span>`;
const logo=()=>`<div class="logo">${mark()}<span class="logotext">Creator Studio</span></div>`;
const btn=(label,action,style='',ic='')=>`<button type="button" class="btn ${style}" data-action="${action}" ${!label?`aria-label="${({play:'播放预览说明',fullscreen:'放大画面',close:'关闭',theme:'切换主题'})[action]||'更多操作'}"`:""}>${ic?icon(ic):''}${label}</button>`;
const badge=(text,color='',ic='')=>`<span class="badge ${color}">${ic?icon(ic):''}${text}</span>`;
const check=()=>`<span class="checkcircle">${icon('check')}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sample=(t='交互原型 · 演示数据')=>`<span class="sample-note">${t}</span>`;
const wave=(n=44)=>`<div class="wave" aria-hidden="true">${Array.from({length:n},(_,i)=>`<span style="height:${Math.round(4+(Math.sin(i*2.4)+1)*6+(Math.sin(i*.83)+1)*3)}px"></span>`).join('')}</div>`;
const cover=(i=0,title=null,time='04:32')=>`<div class="cover"><div class="cover-art art-${i%5}"></div><div class="cover-label">CREATOR STUDIO / EDITORIAL</div><div class="cover-title">${title||['当算力<br>成为新资产','在变化中<br>看见长期','把复杂<br>讲得清楚','把研究<br>带到镜头前','一种新的<br>表达方式'][i%5]}</div><div class="cover-sub">观点，值得被看见。</div><span class="cover-duration">${time}</span><span class="cover-tag">示例作品</span></div>`;
const chart=(small=false)=>`<div class="viewer graph"><span class="safe-mark">设计示例 / 非市场数据</span><header><div class="kicker">CHAPTER 02 · 从投入到产出</div><h2>增长，何时变成回报？</h2><p class="chart-sub">投入与产出趋势 · 指数化示意</p></header><div class="chart-inner"><svg viewBox="0 0 640 150" preserveAspectRatio="none" aria-label="用于界面设计的虚构趋势图"><defs><linearGradient id="area${small?'S':''}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#90bcab" stop-opacity=".28"/><stop offset="100%" stop-color="#90bcab" stop-opacity="0"/></linearGradient></defs><path d="M0 20H640M0 66H640M0 111H640" stroke="#bdd1c2" stroke-opacity=".14" stroke-width="1"/><path d="M0 133 C60 125 85 130 125 115S200 104 240 86 300 101 341 68 410 68 463 38 540 44 565 19 610 9 640 0V150H0Z" fill="url(#area${small?'S':''})"/><path d="M0 133 C60 125 85 130 125 115S200 104 240 86 300 101 341 68 410 68 463 38 540 44 565 19 610 9 640 0" stroke="#c8ded1" stroke-width="3" fill="none"/><path d="M0 136 C110 135 147 126 204 127S310 120 360 112 448 94 493 96 560 65 640 53" stroke="#77959b" stroke-width="2" stroke-dasharray="5 6" fill="none"/><circle cx="463" cy="38" r="4" fill="#dcebe0"/></svg></div><div class="chart-bottom">示意图，不构成事实证据。真实项目需绑定原始数据与许可。</div></div>`;
let stored={};try{stored=JSON.parse(localStorage.getItem('ancs-quiet-frame')||'{}')}catch{}
const state={route:'home',importTab:'url',input:stored.input||'',projectTitle:stored.projectTitle||'当算力成为新资产',selectedScene:2,filter:'全部项目',assetFilter:'全部素材',approved:stored.approved||false,reviewed:false,connected:false,installed:[],history:[],timeline:false,search:'',theme:stored.theme||'light',script:stored.script||'',voice:'沉静 · 叙述',...{}};
const save=()=>{try{localStorage.setItem('ancs-quiet-frame',JSON.stringify({input:state.input,projectTitle:state.projectTitle,approved:state.approved,theme:state.theme,script:state.script}))}catch{}};
const ROUTES={home:'创作台',new:'新建作品',script:'脚本',editor:'导演工作台',assets:'素材库',identity:'创作者身份',render:'成片与审核',publish:'交付与发布',analytics:'作品表现',extensions:'扩展工具',settings:'设置',welcome:'产品首页',system:'设计系统'};
function nav(route){if(!ROUTES[route])route='home';location.hash=route;if(state.route===route)render()}
function shell(content,project=false){const navs=[['home','grid','创作台'],['assets','folder','素材库'],['identity','voice','创作者身份'],['extensions','box','扩展工具']];return `<div class="app"><aside class="sidebar" aria-label="主导航">${logo()}<button class="workspace-switch" data-action="workspace"><span class="circle">C</span><span class="grow small">个人工作室</span>${icon('down')}</button><div class="navgroup"><div class="navlabel">工作空间</div>${navs.map(([r,i,t])=>`<button class="navitem ${state.route===r?'active':''}" data-nav="${r}" ${state.route===r?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')}</div><div class="navgroup"><div class="navlabel">最近作品</div><button class="navitem ${project?'active':''}" data-nav="editor">${icon('film')}<span>当算力成为新资产</span></button><button class="navitem" data-nav="script">${icon('file')}<span>每周商业观察</span></button></div><div class="sidebottom"><button class="navitem" data-action="command">${icon('search')}<span class="grow">快速搜索</span><span class="kbd">⌘ K</span></button><button class="navitem ${state.route==='settings'?'active':''}" data-nav="settings">${icon('settings')}<span>设置与用量</span></button><button class="navitem" data-action="guide">${icon('help')}<span>帮助与快捷键</span></button><div class="userrow"><span class="circle">C</span><span class="grow"><strong class="small" style="font-weight:550">Creator</strong><br><span style="font-size:10px;color:var(--muted)">个人工作室</span></span>${icon('down')}</div></div></aside><header class="topbar"><div class="row"><button class="btn icononly ghost mobile-menu" data-action="mobilemenu" aria-label="打开导航">${icon('menu')}</button><div class="breadcrumb"><span class="desktop-only">工作空间</span><span class="desktop-only">${icon('chevron')}</span><strong>${ROUTES[state.route]}</strong></div></div><div class="top-actions">${sample()}<button class="btn icononly ghost desktop-only" data-action="theme" aria-label="切换浅深色">${icon('sun')}</button><button class="btn icononly ghost" data-action="n ection class="panel pad"><div class="row between"><h3>作品方向</h3>${badge('可随时调整')}</div><label class="label mt24" for="project-name">作品名称</label><input id="project-name" class="field" value="${esc(state.projectTitle)}"><div class="settings-row"><div><h4>目标时长</h4><p>根据内容密度规划</p></div><select id="duration" class="compact-select" aria-label="目标时长"><option>约 4–6 分钟</option>约 2–3 分钟</option><option>约 8–10 分钟</option></select></div><div class="settings-row"><div><h4>画面比例</h4><p>专业长视频</p></div>${badge('16:9 横屏')}</div><div class="settings-row"><div><h4>表达方式</h4><p>图表与观点驱动</p></div><select class="compact-select" aria-label="表达方式"><option>研究型解说</option><option>教程讲解</option><option>商业评论</option></select></div><div class="settings-row"><div><h4>声音</h4><p>创作者默认身份</p></div><button class="textbtn small" data-nav="identity">沉静 · 叙述</button></div><div class="mt24">${btn('生成脚本草稿','generate-script','primary full','spark')}</div><p class="sample-note mt16">演示流程，不调用模型、不扣费。</p></section><div class="small muted" style="padding:0 8px;line-height:1.9">先确认叙事，再进入分镜。数字人和生成镜头在草稿阶段只做占位。</div></aside></div></div>`}
function scriptPage(){return `<div class="page" style="padding-top:29px"><div class="script-layout"><aside class="chapter-nav"><div class="eyebrow" style="padding:7px 10px 12px">作品大纲</div>${['开场 · 一个好问题','从投入到产出','回到创作者','结尾 · 留下判断'].map((t,i)=>`<button class="${i===1?'active':''}" data-action="chapter:${i}"><span style="font-size:10px">0${i+1}</span>${t}</button>`).join('')}<hr class="divider"><div style="padding:0 10px" class="small muted">约 4 分 32 秒<br><span style="font-size:10px">阅读视图 · 中文旁白</span></div></aside><article class="paper"><div class="row between">${badge('脚本草稿','blue','file')}<button class="btn ghost small" data-action="lockscript">${icon('unlock')}<span id="locktext">锁定已确认段落</span></button></div><h1>${esc(state.projectTitle)}</h1><div class="row gap8 small muted"><span>研究型解说</span><span>·</span><span>12 个分镜</span><span>·</span>${sample('示例内容')}</div><p class="lead">好作品，不只是把文章读一遍。<br>它让复杂的问题，有一条可以跟随的线索。</p><h2>01　开场：一个值得追问的问题</h2><p contenteditable="true" role="textbox" aria-label="开场旁白" id="script-opening">${esc(state.script||'当一项新技术受到关注，人们最先看到的，往往是投入的规模。更值得追问的是：这些投入，会通过什么方式转化为可持续的价值？')}</p><h2 id="chapter-1">02　从投入到产出</h2><p contenteditable="true" role="textbox" aria-label="第二章旁白">我们可以把这个问题拆成三部分：投入买来了什么，使用需求是否稳定，以及使用最终带来了什么回报。把三者放在同一个画面里，判断才会变得清楚。<button contenteditable="false" class="source-ref" data-action="source:1">1</button></p><p class="mt16">这里使用的是结构示意，而不是市场预测。正式作品中的每一个数字，都需要有明确的数据来源、时间和口径。<button class="source-ref" data-action="source:2">2</button></p><div class="notice mt24">${icon('image')}<div><strong>画面建议</strong><br>用一张双线趋势图呈现关系。绑定数据之前，保持“结构示意”标记。</div></div><h2>03　回到创作者</h2><p>工具应该让创作者把更多精力放在观点和判断上。让 AI 整理素材和组织画面，而由你决定，哪一句值得说、哪一个结论值得留下。</p><div class="row between mt24" style="border-top:1px solid var(--line);padding-top:19px">${sample('本地可编辑 · 失焦后保存')}<button class="textbtn" data-action="aiedit">${icon('spark')}让 AI 帮我修改</button></div></article><aside class="sources-side col"><section class="panel pad" style="padding:20px"><div class="row between"><h3>来源与核对</h3>${badge('2 处关联')}</div><div class="sourceitem"><span class="source-index">1</span><div><strong>原始研究笔记</strong><p>第 2 段 · 投入与产出的表达框架</p><button class="textbtn small" data-action="source:1">查看原文 ${icon('arrow')}</button></div></div><div class="sourceitem"><span class="source-index">2</span><div><strong>图表数据说明</strong><p>当前为设计示例。正式数据尚未绑定。</p>${badge('需补充数据','amber')}</div></div><hr class="divider"><div class="small muted" style="line-height:1.9">来源计数代表关联，不代表事实已经核验。AI 建议不会覆盖你锁定的内容。</div></section><section class="panel pad" style="padding:20px"><h3>让表达更进一步</h3><p class="small muted mt8">直接说你想怎样修改。</p><div class="col mt16" style="gap:6px">${btn('开场更直接','aiedit','small ghost','spark')}${btn('把术语换成日常表达','aiedit','small ghost','text')}${btn('检查论证是否完整','aiedit','small ghost','shield')}</div></section></aside></div></div>`}

function assetsPage(){let items=[['市场关系示意图','确定性图表 · 示例数据',2,'chart'],['暖调抽象封面','自制示意素材 · 非新闻证据',0,'cover'],['旁白试音片段','音频示意 · 非真人克隆',4,'sound'],['研究原始文档','来源资料 · 示例正文',3,'doc'],['商业评论封面','自制示意素材 · 16:9',1,'cover'],['海蓝色视觉背景','自制示意素材 · 16:9',2,'cover'],['表达框架图','结构示意 · 无事实数值',4,'chart'],['章节脚本草稿','版本保留 · 示例文本',3,'doc']];const f=state.assetFilter;items=items.filter(a=>f==='全部素材'||(f==='图表'&&a[3]==='chart')||(f==='图片'&&a[3]==='cover')||(f==='声音'&&a[3]==='sound')||(f==='文档'&&a[3]==='doc'));return `<div class="page"><div class="sectionhead"><div><div class="eyebrow mb16">YOUR CREATIVE LIBRARY</div><h1>好素材，值得留下。</h1><p>作品、来源与授权，放在同一个地方。</p></div>${btn('上传素材','uploadasset','primary','plus')}</div><div class="row between mt32 mb24"><div class="chips">${['全部素材','图片','图表','声音','文档'].map(t=>`<button class="chip ${f===t?'active':''}" data-action="assetfilter:${t}">${t}</button>`).join('')}</div><div class="searchbox">${icon('search')}<input id="asset-search" placeholder="搜索素材" aria-label="搜索素材"></div></div><div class="asset-grid" id="asset-grid">${items.map(([name,meta,i,type])=>`<button class="asset-item" data-action="asset:${esc(name)}" data-name="${esc(name)}"><div class="cover">${type==='cover'?`<div class="cover-art art-${i}"></div><div class="cover-title">${name.split('封面')[0]}</div><div class="cover-label">CREATOR STUDIO</div>`:type==='chart'?`<div class="asset-chart">${[26,45,62,87,105].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="cover-label" style="color:#4c664f">ILLUSTRATIVE DATA</div>`:type==='sound'?`<div class="asset-sound">${wave(32)}</div>`:`<div class="asset-doc"><div class="document-mini">${Array.from({length:8},()=>'<i></i>').join('')}</div></div>`}</div><div class="asset-info"><h3>${name}</h3><p>${meta}</p><div class="row between mt16">${badge(type==='chart'?'示意数据':type==='doc'?'来源文件':'授权可查',type==='chart'?'amber':'green')}<span style="font-size:10px;color:var(--muted)">2 个作品使用</span></div></div></button>`).join('')}</div><div class="notice mt32">${icon('shield')}<div>素材可用于创作，不代表可用作事实证据。真实照片、AI 画面与结构示意须分别标记。</div></div></div>`}
function identityPage(){return `<div class="page narrow"><div class="sectionhead"><div><div class="eyebrow mb16">A VOICE THAT FEELS LIKE YOU</div><h1>让每部作品，都有你的辨识度。</h1><p>声音、表达与品牌，成为可以复用的创作者身份。</p></div>${btn('保存身份','saveidentity','primary','check')}</div><div class="identity-grid mt32"><section class="panel" style="overflow:hidden"><div class="voice-hero"><div class="row between"><h3>你的旁白声音</h3>${badge('默认身份','green')}</div><div class="voice-sphere" aria-hidden="true"></div><div class="row between"><div><h2 style="font-size:21px">沉静 · 叙述</h2><p class="small muted mt8">清晰、克制，为复杂观点留出空间。</p></div><button class="btn icononly primary" data-action="voice-preview" aria-label="试听系统示例声音">${icon('play')}</button></div><div class="mt24" style="color:#789778">${wave(60)}</div><p class="sample-note mt8">试听使用浏览器系统语音，不代表供应商或克隆音质。</p></div><div class="voice-row selected"><span class="voice-avatar">沉</span><div class="grow"><h4>沉静 · 叙述</h4><p>知识解说 / 中文 / 标准语速</p></div>${check()}</div><div class="voice-row"><span class="voice-avatar" style="background:#ede7dc;color:#8d785c">明</span><div class="grow"><h4>明快 · 对话</h4><p>轻松讲解 / 中文 / 明快节奏</p></div><button class="btn small" data-action="selectvoice">选用</button></div><div class="voice-row"><span class="voice-avatar" style="background:#e3e9ee;color:#607885">+</span><div class="grow"><h4>创建我的声音</h4><p>先完成授权，再上传样本</p></div><button class="btn ghost small" data-action="voice-consent">${icon('arrow')}</button></div></section><div class="col"><section class="panel pad"><div class="row between"><h3>表达风格</h3>${icon('text')}</div><div class="settings-row"><div><h4>语速</h4><p>为理解留下必要停顿</p></div><select class="compact-select" aria-label="旁白语速"><option>1.0× 自然</option><option>0.9× 舒缓</option><option>1.1× 明快</option></select></div><div class="settings-row"><div><h4>语气</h4><p>与你的内容保持一致</p></div><select class="compact-select" aria-label="旁白语气"><option>冷静、专业</option><option>温和、亲近</option><option>轻松、有活力</option></select></div><label class="label mt24" for="pronunciation">专有名词与读音</label><textarea id="pronunciation" class="field" rows="2" placeholder="例如：ANCS，逐字母发音。"></textarea></section><section class="panel pad"><div class="row between"><h3>品牌外观</h3>${icon('layers')}</div><div class="row mt24 gap24"><div class="logomark" style="width:49px;height:49px;border-radius:13px">${mark()}</div><div><strong class="small">个人工作室</strong><p class="small muted mt8">片头 / 片尾 / 字幕</p></div><button class="textbtn small" data-action="brand" style="margin-left:auto">编辑</button></div><div class="settings-row mt8"><h4>品牌色</h4><div class="row gap8"><span class="color-swatch" style="background:#253b3d"></span><span class="color-swatch" style="background:#c8d8c8"></span><span class="color-swatch" style="background:#f2f3eb"></span></div></div><div class="settings-row"><h4>默认画面风格</h4><span class="small muted">极简研究室</span></div></section><div class="notice">${icon('shield')}<div>声音克隆与数字人需要可核验的本人授权。未授权时，不提交任何生成任务。</div></div></div></div></div>`}
function renderPage(){return `<div class="page"><div class="sectionhead"><div><h1>最后一遍，由你把关。</h1><p>检查画面、声音与来源。批准的是这一版成片。</p></div>${badge(state.approved?'演示版本已批准':'等待你的确认',state.approved?'green':'amber',state.approved?'check':'clock')}</div><div class="review-layout mt32"><section>${cover(0,null,'04:32')}<div class="player-bar">${btn('','play','ghost icononly small','play')}<span>00:00</span><span class="scrubber"></span><span>04:32</span>${btn('','fullscreen','ghost icononly small','expand')}</div><div class="panel pad mt24"><div class="row between"><h3>交付版本</h3>${badge('版本 3','blue')}</div><div class="row mt16 between"><div><strong class="small">标准高清 · 1080p</strong><p class="small muted mt8">1920 × 1080 · 16:9 · 中文字幕</p></div><button class="textbtn small" data-action="render-settings">更改规格 ${icon('down')}</button></div><div class="progress"><span></span></div><div class="row between mt8">${sample('原型演示：渲染完成')}<span class="sample-note">不是实际视频文件</span></div></div><div class="row mt24 between"><span class="small muted">这一版不满意？</span>${btn('返回分镜修改','go:editor','small','undo')}</div></section><aside class="col"><section class="panel pad"><div class="row between"><h3>交付检查</h3>${badge('示例清单')}</div><div class="check-list">${[['画面与字幕','检查文字安全区、字幕断句和画面占位。'],['声音与节奏','确认旁白、背景音与章节节奏。'],['来源与授权','示意图明确标记，不冒充市场事实。'],['版本一致性','正式版批准需绑定不可变渲染快照。']].map(([h,p])=>`<div class="check-item">${icon('check')}<div><strong style="font-weight:500">${h}</strong><p>${p}</p></div></div>`).join('')}</div><div class="notice amber">${icon('info')}<div>此处为审核交互演示，并未运行真实 QA。正式产品须以服务端检查结果为准。</div></div></section><section class="panel pad"><h3>批准这一版</h3><p class="small muted mt8" style="line-height:1.9">后续修改会产生新版本，需要重新审核。原型不批准任何真实内容。</p><label class="checkboxrow mt16"><input id="review-check" type="checkbox" ${state.approved?'checked':''}><span>我已检查这个演示版本，继续体验交付流程。</span></label><div class="mt24">${btn(state.approved?'前往交付':'批准并继续','approve','primary full',state.approved?'arrow':'check')}</div><button class="textbtn small mt8" data-action="reject" style="width:100%;justify-content:center;color:var(--muted)">需要修改，留下备注</button></section></aside></div></div>`}
function publishPage(){const platforms=[['Y','YouTube','直接发布','账号未连接 · 真实能力待核验','待连接'],['B','哔哩哔哩','草稿 / 导出','以实际授权与能力核验结果为准','待核验'],['抖','抖音','手动交付','下载视频、封面与文案，由你完成最后发布','导出包'],['X','X','手动交付','准备适配文案，保持人工最后确认','导出包']];return `<div class="page"><div class="sectionhead"><div><h1>作品准备好了。选择下一站。</h1><p>能直接发布的直接发布；需要手动完成的，交付整齐的素材包。</p></div>${badge('能力核验优先','','shield')}</div><div class="split wide mt32"><section><div class="row between mb24"><h3>发布与交付渠道</h3><button class="textbtn small" data-action="capabilities">了解发布能力分级 ${icon('info')}</button></div>${platforms.map(([l,n,m,d,s])=>`<div class="platform-row"><span class="platform-logo">${l}</span><div class="grow"><div class="row gap8"><h3>${n}</h3>${badge(m,m==='手动交付'?'':'blue')}</div><p>${d}</p></div>${btn(s==='导出包'?'准备素材包':'连接并核验',s==='导出包'?'export-package':'connectplatform','small',s==='导出包'?'download':'link')}</div>`).join('')}<div class="notice mt24">${icon('shield')}<div><strong>真实状态，不做假完成。</strong><br>“已送草稿”与“已发布”分别显示。账号未授权、能力未核验时，绝不展示为发布成功。</div></div><section class="panel pad mt24"><div class="row between"><div><h3>从一部作品，延伸更多表达</h3><p class="small muted mt8">Shorts、播客和图文通过扩展生成独立版本。</p></div>${btn('选择扩展','go:extensions','small','box')}</div></section></section><aside class="col"><section class="panel pad"><div class="publication-cover">${cover(0,null,'04:32')}</div><h3 class="mt16">${esc(state.projectTitle)}</h3><div class="row mt8 gap8">${badge('1080p')}${badge('16:9')}${badge(state.approved?'演示版已批准':'尚未批准',state.approved?'green':'amber')}</div><hr class="divider"><h4 class="small">素材包包含</h4><div class="col mt16" style="gap:12px">${[['film','成片视频','MP4'],['file','字幕文件','SRT / VTT'],['image','作品封面','PNG'],['text','标题与简介','TXT']].map(([i,n,t])=>`<div class="row small">${icon(i)}<span class="grow">${n}</span><span class="muted" style="font-size:10px">${t}</span></div>`).join('')}</div><div class="mt24">${btn('下载交付说明样例','sample-download','full','download')}</div><p class="sample-note mt8">仅下载说明文本，不伪造 MP4 文件。</p></section><button class="btn" data-action="handoff">${icon('phone')}发送到手机完成最后一步</button></aside></div></div>`}
function analyticsPage(){return `<div class="page"><div class="sectionhead"><div><div class="eyebrow mb16">LEARN FROM EVERY STORY</div><h1>看见作品，如何被理解。</h1><p>把观看表现放回具体分镜，不让指标替你做创作决定。</p></div><div class="row">${badge('示例数据','amber')}${btn('选择作品','selectwork','small','down')}</div></div><div class="metricgrid mt32">${[['观看次数','12,480','示例统计 · 非真实平台数据'],['平均观看时长','02:41','4 分 32 秒视频 · 示例'],['完播率','48.6%','示例统计 · 独立指标'],['收藏次数','—','平台未返回，不按 0 处理']].map(([l,v,n])=>`<div class="metriccard"><h4>${l}</h4><div class="value">${v}</div><small>${n}</small></div>`).join('')}</div><div class="split wide mt24"><section class="panel pad"><div class="row between"><div><h3>观看留存，回到每个场景</h3><p class="small muted mt8">横轴为作品时间 · 纵轴为相对观看留存</p></div>${badge('示意曲线')}</div><div class="retention"><svg viewBox="0 0 680 200" preserveAspectRatio="none" aria-label="虚构示例留存曲线"><defs><linearGradient id="retarea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c9b80" stop-opacity=".2"/><stop offset="100%" stop-color="#7c9b80" stop-opacity="0"/></linearGradient></defs><path d="M0 20H680M0 85H680M0 150H680" stroke="#e2e7dd" fill="none"/><path d="M0 25 C45 28 70 42 95 46S137 48 163 75 200 93 240 93 300 98 350 109 420 118 450 120 565 124 680 134V175H0Z" fill="url(#retarea)"/><path d="M0 25 C45 28 70 42 95 46S137 48 163 75 200 93 240 93 300 98 350 109 420 118 450 120 565 124 680 134" fill="none" stroke="#789578" stroke-width="2.5"/><path d="M163 10v164" stroke="#9caa92" stroke-dasharray="4 4"/><circle cx="163" cy="75" r="5" fill="#789578" stroke="white" stroke-width="2"/><text x="177" y="48" fill="#65745f" font-size="12">01:04 · 进入数据解释</text><g fill="#6d7967" font-size="10"><text x="0" y="197">00:00</text><text x="150" y="197">01:00</text><text x="315" y="197">02:00</text><text x="480" y="197">03:00</text><text x="645" y="197">04:32</text></g></svg></div><p class="sample-note mt16">仅为界面演示。相关变化不等于因果，低样本时不产生确定性结论。</p></section><aside class="panel pad"><div class="row between"><h3>创作复盘</h3>${icon('spark')}</div><div class="analysis-insight"><h4>数据段落，可以先给一个结论。</h4><p>示例曲线在进入解释段落时下降。可测试先展示核心观点，再解释图表；这只是待验证假设。</p><div class="row between mt16">${badge('待测试建议')}${btn('加入下次计划','acceptinsight','small')}</div></div><div class="mt24 small muted" style="line-height:1.9">接受建议只记录你的选择，不会静默修改栏目设置，也不会改动已发布作品。</div><button class="textbtn small mt16" data-action="insight-details">查看依据与限制 ${icon('arrow')}</button></aside></div><section class="panel pad mt24"><div class="row between mb16"><h3>分镜表现</h3>${sample('对应冻结版本，不随草稿变化')}</div><table class="data-table"><thead><tr><th>分镜</th><th>时间位置</th><th>画面类型</th><th>状态</th><th></th></tr></thead><tbody>${[['01','一个好问题','00:00 – 00:18','开场观点'],['03','增长与回报','01:04 – 01:36','趋势图表']].map(([n,t,m,c])=>`<tr><td>${n}　${t}</td><td class="muted">${m}</td><td>${c}</td><td>${badge('示例观察')}</td><td><button class="textbtn small" data-nav="editor">回看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></section></div>`}
function extensionsPage(){const packs=[['phone','Shorts','同一个观点，用短视频重新讲。独立开场与节奏，不只是横屏裁切。','生成 9:16 短视频'],['chart','财经图表','数据、单位、时区与许可一起保留。把事实关系变成可读的画面。','六类专业组件'],['voice','播客','从已确认的内容延伸音频表达，保留叙事与来源关联。','声音优先'],['globe','多语言','为不同语言调整表达，同时保留原始内容与版本关系。','独立派生版本'],['image','图文与短文','提炼一个观点，组织图片与文案，而不是堆叠缩略内容。','按渠道适配'],['upload','发布与交付','按实际授权决定直接发布、送至草稿，或交给你完成。','能力核验优先']];return `<div class="page"><div class="sectionhead"><div><div class="eyebrow mb16">MORE POSSIBILITIES. SAME FOCUS.</div><h1>需要时，再多一步。</h1><p>主流程只专注一部好作品。更多表达方式，按需启用。</p></div>${badge('官方扩展目录')}</div><div class="notice mt24">${icon('box')}<div>目录展示的是设计入口。正式启用仍需满足安装、工作区权限、项目绑定与功能权益。</div></div><div class="pack-grid mt24">${packs.map(([i,n,d,t])=>`<section class="pack-card"><div class="row between"><span class="pack-icon">${icon(i)}</span>${badge('官方')}</div><h3>${n}</h3><p>${d}</p><div class="row between"><span class="sample-note">${t}</span>${btn(state.installed.includes(n)?'已加入演示':'了解并启用',`pack:${n}`,'small')}</div></section>`).join('')}</div><p class="small muted mt24">扩展生成的内容保留独立版本与来源关系，不覆盖原长视频。此页不是开放插件市场已上线的声明。</p></div>`}
function settingsPage(){return `<div class="page narrow"><div class="page-head"><h1>保持掌控，也保持简单。</h1><p>默认设置服务于创作，技术细节按需展开。</p></div><div class="settings-layout mt32"><aside class="setting-nav">${['模型与连接','用量与预算','工作区与成员','安全与隐私','外观与偏好'].map((n,i)=>`<button class="${i===0?'active':''}" data-action="setting:${i}">${n}</button>`).join('')}</aside><div id="settings-content"><section class="panel pad"><div class="row between"><div><h3>模型与生成服务</h3><p class="small muted mt8">按能力选择。创作者不必逐个管理模型。</p></div>${icon('layers')}</div><div class="segmented mt24"><button class="active" data-action="mode:managed">平台托管</button><button data-action="mode:byok">使用自己的 API</button></div><div id="provider-mode-note" class="small muted mt16">原型展示服务配置方式。没有已连接的真实账户或密钥。</div>${[['AI','脚本与导演','语言理解、叙事与结构化修改','LLM'],['VO','旁白声音','声音合成与授权克隆','ElevenLabs'],['AV','数字人','按场景生成，保持身份一致','HeyGen'],['MV','视频镜头','只生成必要镜头，避免重复支出','Veo / Runway']].map(([l,n,d,p])=>`<div class="provider-row"><span class="provider-icon">${l}</span><div class="grow"><h3>${n}</h3><p>${d}</p></div>${badge('未连接')}${btn('查看配置',`provider:${p}`,'small')}</div>`).join('')}</section><section class="panel pad mt24"><div class="row between"><div><h3>费用保护</h3><p class="small muted mt8">修改草稿与生成媒体分别确认。</p></div>${icon('shield')}</div><div class="settings-row mt8"><div><h4>付费生成前显示估算</h4><p>展示影响场景、报价有效期和最高预算</p></div><button class="switch" role="switch" aria-checked="true" aria-label="付费前显示估算" data-action="switch"></button></div><div class="settings-row"><div><h4>达到预算时暂停</h4><p>由服务端执行，前端不绕过预算闸门</p></div><button class="switch" role="switch" aria-checked="true" aria-label="达到预算时暂停" data-action="switch"></button></div><div class="notice mt16">${icon('lock')}<div>真实密钥只能提交到受保护的后端，页面仅显示掩码。这个离线原型不采集任何 API Key。</div></div></section></div></div></div>`}
function welcomePage(){return `<div class="landing"><header class="landing-nav">${logo()}<div class="landing-links"><a href="#system">设计理念</a><a href="#extensions">扩展能力</a><a href="#identity">创作者身份</a>${btn('进入工作室','go:home','primary small','arrow')}</div></header><main class="landing-hero" id="main"><div class="eyebrow">A STUDIO FOR YOUR THINKING.</div><h1>一篇好文章。<br><span>一部好作品。</span></h1><p>把研究交给 AI，把表达留给你。<br>从脚本、分镜到成片，让观点有自己的画面。</p><div class="landing-buttons">${btn('开始你的第一部作品','go:new','primary large','arrow')}${btn('体验导演工作台','go:editor','large','play')}</div><div class="row mt16" style="justify-content:center;font-size:11px;color:var(--muted)">${icon('shield')}先看草稿，再确认生成　·　不自动发布</div><div class="landing-product"><aside class="mini-side">${logo()}${Array.from({length:6},()=>'<div class="mini-row"></div>').join('')}</aside><section class="mini-content"><div class="row between" style="font-size:10px"><span>当算力成为新资产</span>${badge('草稿预览','green')}</div>${chart(true)}<div class="prompt-dock" style="margin-top:14px;padding:10px">${icon('spark')}<span class="small muted grow">让这一段，更有说服力。</span>${icon('arrow')}</div></section><aside class="mini-inspector"><h3 style="font-size:12px">画面设置</h3><div class="mini-preview mt24"><span style="height:14px"></span><span style="height:23px"></span><span style="height:34px"></span><span style="height:41px"></span></div><p>趋势对比 / 确定性组件</p>${[['标题','增长与回报'],['时长','32 秒'],['来源','可追溯'],['配色','品牌默认']].map(([k,v])=>`<div class="mini-setting"><span>${k}</span><span>${v}</span></div>`).join('')}<p>AI 提出修改建议。<br>只有你确认，作品才改变。</p></aside></div></main><footer class="landing-values"><span>${icon('file')}　内容驱动，不从空时间线开始</span><span>${icon('shield')}　事实与来源，始终在场</span><span>${icon('spark')}　AI 创造，你来决定</span></footer><div class="sample-note" style="text-align:center;padding:16px">产品视觉方案 · 能力描述需通过实际验收后上线</div></div>`}
function systemPage(){return `<div class="page"><div class="sectionhead"><div><div class="eyebrow mb16">ANCS / DESIGN SYSTEM 01</div><h1>Quiet Frame · 静框</h1><p>让界面退后，让作品上前。克制的材质，明确的操作。</p></div>${btn('返回创作台','go:home','small','arrow')}</div><div class="design-colors mt32">${[['#F6F6F4','Canvas','画布'],['#FFFFFF','Surface','工作表面'],['#EEE FED'.replace(' ',''),'Sidebar','导航层'],['#202322','Ink','主文字'],['#1768B2','Action','交互强调'],['#34735B','Success','完成状态']].map(([c,n,z])=>`<div class="color-tile" style="background:${c};color:${['Ink','Action','Success'].includes(n)?'white':'#495649'}"><strong>${n} · ${z}</strong><span>${c}</span></div>`).join('')}</div><div class="type-spec mt32"><section class="panel pad"><h3>清晰的文字层级</h3><div class="spec-line"><span style="font-size:36px;font-weight:600;letter-spacing:-.05em">把观点，变成作品。</span><span class="sample-note">36 / 1.25</span></div><div class="spec-line"><span style="font-size:23px;font-weight:600">继续创作</span><span class="sample-note">23 / 1.4</span></div><div class="spec-line"><span style="font-size:16px">让表达，更进一步。</span><span class="sample-note">16 / 1.6</span></div><div class="spec-line"><span style="font-size:14px">正文保持完整，不为极简牺牲可读性。</span><span class="sample-note">14 / 1.8</span></div><div class="spec-line"><span style="font-size:12px;color:var(--muted)">状态、说明与辅助信息</span><span class="sample-note">12 / 1.6</span></div></section><section class="panel pad"><h3>只在该强调时强调</h3><div class="row mt24 gap8">${btn('开始创作','go:new','primary','arrow')}${btn('生成草稿','go:new','blue','spark')}${btn('取消','demo-cancel')}</div><div class="row mt24 gap8">${badge('已保存','green','check')}${badge('等待确认','amber','clock')}${badge('来源缺失','red','info')}</div><hr class="divider"><h3>柔和，但不含糊</h3><div class="rounded-demo">${[6,10,16,24].map(r=>`<div style="border-radius:${r}px">${r}</div>`).join('')}</div><p class="small muted mt16">间距 4 / 8 / 12 / 16 / 24 / 32 / 48<br>按钮 40 px · 主要触控 44–48 px</p><div class="row mt24">${btn('切换深浅色','theme','small','sun')}${btn('查看快捷键','guide','small')}</div></section></div><section class="panel pad mt24"><h3>状态，同样需要设计。</h3><div class="status-board"><div>${badge('加载中')}<h4 class="mt16">正在读取资料</h4><p class="small muted mt8">保留当前内容，不让布局跳动。</p></div><div>${badge('版本冲突','amber')}<h4 class="mt16">作品已有更新</h4><p class="small muted mt8">先比较差异，再决定如何保留。</p><button class="textbtn small mt8" data-action="conflict">查看解决方式 ${icon('arrow')}</button></div><div>${badge('需要授权','blue')}<h4 class="mt16">声音尚未获得授权</h4><p class="small muted mt8">完成授权前，不提交克隆任务。</p><button class="textbtn small mt8" data-action="voice-consent">查看授权流程 ${icon('arrow')}</button></div></div></section></div>`}
const pages={home,new:newPage,script:scriptPage,editor:editorPage,assets:assetsPage,identity:identityPage,render:renderPage,publish:publishPage,analytics:analyticsPage,extensions:extensionsPage,settings:settingsPage,welcome:welcomePage,system:systemPage};
function render(){state.route=location.hash.replace('#','')||'home';if(!pages[state.route])state.route='home';document.body.classList.toggle('theme-dark',state.theme==='dark'&&state.route!=='welcome');document.getElementById('root').innerHTML=state.route==='welcome'?welcomePage():shell(pages[state.route](),['script','editor','render','publish'].includes(state.route));document.title=`${ROUTES[state.route]} · Creator Studio`;document.querySelectorAll('button:not([type])').forEach(b=>b.type='button');window.scrollTo(0,0)}
let toastTimer,lastFocus;
function toast(text){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${icon('check')}${esc(text)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',4000)}
function openModal(title,body,actions=''){lastFocus=document.activeElement;document.getElementById('layer').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row between"><h2 id="modal-title">${title}</h2><button class="btn ghost icononly" data-action="close" aria-label="关闭">${icon('close')}</button></div>${body}<div class="actions">${actions||btn('知道了','close','primary')}</div></section></div>`;document.getElementById('layer').querySelector('input,button,textarea,select')?.focus()}
function closeLayer(){document.getElementById('layer').innerHTML='';lastFocus?.focus?.()}
function openDrawer(title,body){lastFocus=document.activeElement;document.getElementById('layer').innerHTML=`<div class="drawer-backdrop" data-backdrop="true"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="row between"><h2 id="drawer-title">${title}</h2><button class="btn ghost icononly" data-action="close" aria-label="关闭">${icon('close')}</button></div>${body}</section></div>`;document.getElementById('layer').querySelector('button,input')?.focus()}
function openAI(){const opening=document.getElementById('script-opening');const context=opening?'脚本 · 开场旁白':'03 · 增长与回报 / 旁白';const before=opening?opening.textContent:'把投入、使用和回报放在同一个画面里，判断才会变得清楚。';const after=opening?'当一项新技术受到关注，先看投入如何转化为价值。':'看清投入如何变成回报，判断才有依据。';const prompt=document.getElementById('ai-prompt')?.value.trim()||'让这段更简洁，保留观点和来源';openDrawer('先看修改，再做决定。',`<div class="notice mt24">${icon('spark')}<div>${esc(prompt)}</div></div><p class="muted mt24">下面是预设的交互示例，不是实时模型响应。</p><div class="diff-card"><header>${esc(context)}</header><div class="diff-remove">− ${esc(before)}</div><div class="diff-add">+ ${esc(after)}</div></div><div class="row between small"><span>影响范围</span><strong style="font-weight:500">1 个分镜 · 仅旁白</strong></div><div class="row between small mt16"><span>已锁定内容</span><span class="muted">不修改</span></div><div class="row between small mt16"><span>本次演示费用</span>${badge('0 · 不调用 API','green')}</div><p class="muted mt24">正式产品应显示真实操作差异。确认后通过编辑协议写入；素材重生成必须另行确认。</p><div class="col mt32" style="gap:10px">${btn('应用这项修改','applyai','primary full','check')}${btn('保留原文','close','full')}</div>`)}
function command(){const entries=Object.entries(ROUTES);openModal('快速前往',`<input class="command-input mt16" id="command-search" placeholder="搜索页面、作品或操作…" aria-label="搜索命令"><div class="command-list mt16" id="command-results">${entries.map(([r,n])=>`<button data-nav="${r}" data-command-label="${n}"><span>${n}</span>${icon('arrow')}</button>`).join('')}</div>`,btn('关闭','close','small'));document.getElementById('command-search').focus()}
function downloadSample(){const content='Creator Studio · 交付说明样例\n\n本文件来自离线视觉原型，不含视频或真实发布凭据。\n\n正式交付包应包含：\n1. 经 QA 与人工批准的 MP4\n2. SRT / VTT 字幕\n3. PNG 封面\n4. 标题、简介、来源署名\n5. 与批准版本一致的 manifest\n\n平台未核验时，不展示已发布。\n';const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Creator_Studio_交付说明样例.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已下载交付说明样例；没有生成假视频文件。')}
const actions={
start(){state.input=document.getElementById('home-source').value.trim();state.importTab=state.input.startsWith('http')?'url':state.input?'text':'url';save();nav('new')},
'read-source'(){const val=document.getElementById('source-url').value.trim();try{const u=new URL(val);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{return toast('请输入完整的 http 或 https 文章链接。')}state.input=val;save();toast('已记录链接。原型不抓取网页；下方预览仍是示例资料。')},
'generate-script'(){const title=document.getElementById('project-name').value.trim();if(!title)return toast('先为作品起一个名称。');state.approved=false;state.projectTitle=title;const v=document.getElementById(state.importTab==='url'?'source-url':'source-text');if(v)state.input=v.value.trim();save();nav('script');toast('已打开预置脚本示例；未调用模型或扣费。')},
'confirm-script'(){save();nav('editor');toast('脚本确认流程已演示；进入分镜工作台。')},
lockscript(){const p=document.getElementById('script-opening');const locked=p.getAttribute('contenteditable')==='true';p.setAttribute('contenteditable',String(!locked));document.getElementById('locktext').textContent=locked?'解除段落锁定':'锁定已确认段落';toast(locked?'演示段落已锁定，AI 不会覆盖它。':'已解除演示段落锁定。')},
aiedit:openAI,
applyai(){const opening=document.getElementById('script-opening');if((opening&&opening.getAttribute('contenteditable')!=='true')||(state.route==='editor'&&state.selectedScene===3))return toast('当前内容已锁定，请先解除锁定再修改。');state.approved=false;if(opening){opening.textContent='当一项新技术受到关注，先看投入如何转化为价值。';state.script=opening.textContent;}save();const line=document.querySelector('.narration-line');if(line){line.innerHTML='<div class="small muted" style="font-size:10px;margin-bottom:6px">当前旁白 · 本地演示修改</div>“看清投入如何变成回报，判断才有依据。”'}state.history.push('AI 修改演示：缩短第 3 个分镜的旁白');closeLayer();toast('已应用本地演示修改。可从版本历史查看。')},
approve(){if(state.approved)return nav('publish');if(!document.getElementById('review-check').checked)return toast('请先勾选确认，再继续体验交付流程。');state.approved=true;save();nav('publish');toast('已批准演示版本。不会批准或发布真实内容。')},
reject(){openModal('留下修改意见',`<p>返回编辑前，保留这次审核的关注点。</p><textarea id="reject-note" class="field mt16" rows="4" placeholder="例如：第二章旁白太密，需要增加停顿。"></textarea>`,btn('取消','close')+btn('记录并返回编辑','save-reject','primary'))},
'save-reject'(){const t=document.getElementById('reject-note').value.trim();if(!t)return toast('请填写修改意见。');state.history.push('审核意见：'+t);state.approved=false;save();closeLayer();nav('editor');toast('修改意见已保留在本次演示的版本历史。')},
'export-package'(){if(!state.approved)return openModal('先批准这一版作品',`<p>交付包与批准版本绑定。未经批准时，不能绕过审核直接导出。</p>`,btn('返回','close')+btn('前往审核','go:render','primary'));openModal('交付包 · 能力演示',`<p>正式产品应打包已批准的视频、字幕、封面和文案，再交给你完成最后发布。</p><div class="notice mt16">${icon('info')}<div>离线原型不包含真实视频，只提供交付说明样例。</div></div>`,btn('取消','close')+btn('下载说明样例','sample-download','primary','download'))},
'sample-download':downloadSample,
connectplatform(){openModal('连接渠道，先核验能力',`<p>正式产品通过平台 OAuth 完成授权，然后由后端核验直接发布、送至草稿或导出能力。</p><div class="notice amber mt16">${icon('lock')}<div>这里没有真实 OAuth 服务，因此不会打开假授权、收集密码或显示连接成功。</div></div>`,btn('了解能力分级','capabilities')+btn('返回交付','close','primary'))},
capabilities(){openModal('四种交付能力',`<div class="col mt24">${[['P1','直接发布','已授权并核验后，提交正式发布。'],['P2','受限发布','按平台限制和审批结果开放。'],['P3','送至草稿','需要创作者在平台完成发布。'],['P4','素材包交付','打包后由创作者手动发布。']].map(([n,t,d])=>`<div class="row">${badge(n,'blue')}<div><h3 class="small">${t}</h3><p style="margin-top:3px;font-size:12px">${d}</p></div></div>`).join('')}</div><p>具体能力来自后端实测，不把平台名称直接等同于发布权限。</p>`)},
handoff(){openModal('在手机上，完成最后一步',`<p>正式版提供有时效、可撤销的安全交接链接。手机端领取后，继续预览或手动发布。</p><div class="notice mt16">${icon('phone')}<div>原型不生成假二维码或可公开访问的下载链接。</div></div>`)},
history(){openDrawer('版本与操作历史',`<p class="muted mt16">正式记录应来自服务端，不可变快照与修改摘要一起保留。</p><div class="task-row mt16">${check()}<div><h4>版本 3 · 当前草稿</h4><p>演示预置版本 · 不是仓库数据</p></div></div>${state.history.length?state.history.map(t=>`<div class="task-row">${icon('clock')}<div><h4>${esc(t)}</h4><p>本次浏览器演示操作</p></div></div>`).join(''):'<div class="notice mt24">尚未进行本地修改演示。</div>'}<button class="btn full mt24" data-action="conflict">查看版本冲突设计</button>`)},
conflict(){openModal('作品已有更新。你的修改仍在。',`<p>正式产品遇到版本冲突时，应保留本地文本，比较最新版本，禁止静默覆盖。</p><div class="diff-card"><header>演示差异 · 当前旁白</header><div class="diff-remove">本地：把三个变量放在同一张图上。</div><div class="diff-add">服务端：先呈现观点，再解释三个变量。</div></div>`,btn('保留本地草稿','keepdraft')+btn('查看最新版本','latestversion','primary'))},
keepdraft(){closeLayer();toast('本地演示草稿已保留；真实版本未被改动。')},latestversion(){closeLayer();toast('版本比较交互已演示，不刷新丢弃本地修改。')},
'voice-preview'(){if(!('speechSynthesis'in window))return toast('此浏览器没有系统语音，试听不可用。');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('好作品，不只是把文章读一遍。它让复杂的问题，有一条可以跟随的线索。');u.lang='zh-CN';u.rate=.92;speechSynthesis.speak(u);toast('正在尝试浏览器系统语音；非真人克隆音质。')},
'voice-consent'(){openModal('这段声音，属于你吗？',`<p>声音身份必须建立在明确授权上。正式版需要保存授权记录、用途、时间与撤销方式。</p><label class="checkboxrow mt24"><input id="consent-check" type="checkbox"><span>我理解：仅使用本人声音，或持有可核验的明确授权。</span></label><div class="notice mt16">${icon('shield')}<div>勾选只是原型交互，不构成完整授权验证，也不会启动克隆。</div></div>`,btn('取消','close')+btn('查看样本要求','consent-next','primary'))},
'consent-next'(){if(!document.getElementById('consent-check').checked)return toast('请先阅读并确认授权要求。');openModal('录音样本 · 后续流程',`<p>正式产品应显示对应供应商经核验的样本规范，并支持上传、质检、删除和撤销。</p><div class="notice amber mt16">${icon('info')}<div>尚未连接真实克隆服务，本原型不接收声音样本。</div></div>`)},
selectvoice(){state.voice='明快 · 对话';toast('已选择演示声音风格；真实身份未改变。')},saveidentity(){toast('身份设置已完成视觉演示，不写入真实账户。')},
brand(){openModal('品牌外观',`<p>一个身份统一片头、字幕、图表和片尾。优先复用栏目样式，不逐场景重复设置。</p><div class="row mt24"><span class="color-swatch" style="background:#253b3d;width:34px;height:34px"></span><span class="color-swatch" style="background:#c8d8c8;width:34px;height:34px"></span><span class="color-swatch" style="background:#f2f3eb;width:34px;height:34px"></span></div><label class="label mt24">展示名称</label><input class="field" value="个人工作室">`,btn('取消','close')+btn('保存演示样式','brand-save','primary'))},'brand-save'(){closeLayer();toast('品牌样式保存交互已演示。')},
'render-settings'(){openModal('这一版，怎样交付？',`<p>选择规格后，正式系统应重新预检并报价。不会因为切换选项自动生成。</p><div class="col mt24">${[['720p','快速草稿','仅用于评审'],['1080p','标准高清','当前选择 · 1920 × 1080'],['4K','超清输出','需要权益与成本确认']].map(([n,t,d],i)=>`<button class="plan-option ${i===1?'selected':''}" data-action="profile:${n}" style="text-align:left"><div class="row between"><span><strong class="small">${t}</strong><span class="small muted">　${n}</span></span><span class="radio"></span></div><p style="font-size:11px;margin-top:5px">${d}</p></button>`).join('')}</div>`,btn('取消','close')+btn('查看生成确认','render-confirm','primary'))},
'render-confirm'(){openModal('生成之前，先确认成本。',`<p>正式产品应展示本次冻结版本、生成场景、有效报价、余额及预算上限。</p><div class="notice mt24">${icon('credit')}<div>演示估价：36 点 / 不代表供应商报价。原型没有支付或付费 API，不会产生费用。</div></div><label class="checkboxrow mt16"><input id="cost-check" type="checkbox"><span>我理解这里是付费确认交互示例。</span></label>`,btn('返回','close')+btn('确认演示','render-demo','primary'))},
'render-demo'(){if(!document.getElementById('cost-check').checked)return toast('请先确认演示说明。');closeLayer();toast('确认交互已完成，没有发出渲染或扣费请求。')},
play(){toast('这里是交互静帧，不假装已生成可播放视频。')},volume(){toast('正式音量控制应修改场景图；原型没有视频音轨。')},fullscreen(){openModal('画面预览',chart()+`<p>设计示例静帧。正式版使用现有同源播放器。</p>`);document.querySelector('.modal').style.maxWidth='980px'},
'addscene'(){openModal('添加一个分镜',`<p>按叙事意图添加，不从空素材轨道开始。</p><div class="chips mt24">${['观点卡片','趋势图表','来源引用','结构关系'].map(t=>btn(t,'demo-add','small')).join('')}</div>`)},'demo-add'(){state.history.push('演示：请求添加分镜');closeLayer();toast('分镜类型选择完成。正式接入应通过编辑协议新增。')},
timeline(){state.timeline=!state.timeline;render()},
'scene-info'(){openModal('场景信息',`<p>对应分镜 03 · 趋势对比。版本、来源绑定、组件版本等工程信息放在此处，不挤占主画布。</p><div class="notice mt16">${icon('info')}<div>这是设计示例，不包含真实项目 ID 或数据库记录。</div></div>`)},
'project-more'(){openModal('作品操作',`<div class="col mt24">${btn('版本与操作历史','history','','clock')}${btn('查看作品表现','go:analytics','','chart')}${btn('查看发布能力','capabilities','','upload')}</div>`)},
command,close:closeLayer,
theme(){state.theme=state.theme==='light'?'dark':'light';save();render();toast(state.theme==='dark'?'已切换深色演示主题。':'已切换浅色主题。')},
notifications(){openDrawer('任务与通知',`<div class="task-row mt24">${check()}<div><h4>成片等待你的审核</h4><p>示例作品 · 不是实际渲染通知</p></div></div><div class="task-row">${icon('shield')}<div><h4>没有自动生成任务</h4><p>原型不调用任何付费服务</p></div></div><button class="btn full mt24" data-nav="render">前往成片审核</button>`)},
workspace(){openModal('工作空间',`<div class="task-row mt24"><span class="circle">C</span><div class="grow"><h4>个人工作室</h4><p>演示工作空间</p></div>${check()}</div><p>正式版在这里切换团队，项目、预算和权限始终随工作区隔离。</p>`)},
filterprojects(){toast('原型按预置的最近编辑顺序排列；全部状态都保留新建入口。')},
uploadasset(){openModal('上传素材',`<p>正式版需要走现有上传、扫描、授权与对象存储流程。</p><div class="notice mt16">${icon('shield')}<div>本原型不上传任何文件。可在新建作品中读取本地 .txt / .md 体验导入。</div></div>`,btn('取消','close')+btn('体验文档导入','input:file','primary'))},
acceptinsight(){state.history.push('接受示例建议：下次先给结论');toast('示例建议已记入当前会话；没有修改栏目或已发布作品。')},
'insight-details'(){openModal('先区分观察，再谈结论。',`<p>正式复盘应显示样本量、指标口径、采样区间、冻结版本与证据位置。未知指标保持未知。</p><div class="notice amber mt16">${icon('info')}<div>本页图表全部为虚构示例。留存下降不证明某一场景导致流失。</div></div>`)},
selectwork(){openModal('选择作品',`<div class="col mt24">${btn('当算力成为新资产 · 示例','close')}${btn('每周商业观察 · 无数据','noanalytics')}</div>`)},noanalytics(){closeLayer();toast('当前没有已核验的平台数据，不能显示为 0 或伪造增长。')},
mobilemenu(){document.querySelector('.sidebar')?.classList.toggle('mobile-open')},
resetdemo(){try{localStorage.removeItem('ancs-quiet-frame')}catch{}state.approved=false;state.input='';state.projectTitle='当算力成为新资产';state.script='';state.history=[];state.theme='light';closeLayer();nav('home');render();toast('已清除本原型的本地演示数据。')},guide(){openModal('把注意力留给创作。',`<p><strong>主流程</strong><br>创作台 → 导入 → 脚本 → 分镜 → 成片审核 → 交付。</p><p><strong>快捷操作</strong><br>⌘ / Ctrl + K：页面与操作搜索<br>Esc：关闭抽屉或弹窗<br>Tab：键盘访问各项操作</p><p>浏览器原型为本地演示。真实生成、OAuth、账单、来源抓取和上传均未连接。</p><div class="row mt24">${btn('产品首页','go:welcome','small')}${btn('设计系统','go:system','small')}${btn('清除演示数据','resetdemo','small')}</div>`)},'demo-cancel'(){toast('次要操作只保持上下文，不触发生成。')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action]');if(!b){if(e.target.dataset.backdrop)closeLayer();return}if(b.disabled)return;if(b.dataset.nav){closeLayer();nav(b.dataset.nav);return}const a=b.dataset.action;if(a.startsWith('go:')){closeLayer();nav(a.slice(3));return}if(actions[a]){actions[a](b);return}const [kind,...rest]=a.split(':');const val=rest.join(':');switch(kind){case'input':closeLayer();const hv=document.getElementById('home-source');if(hv)state.input=hv.value;state.importTab=val;nav('new');break;case'tab':{const f=document.getElementById(state.importTab==='url'?'source-url':'source-text');if(f)state.input=f.value;state.importTab=val;render();break}case'scene':state.selectedScene=Number(val);render();break;case'assetfilter':state.assetFilter=val;render();break;case'switch':b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));break;case'chapter':document.querySelectorAll('.chapter-nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('.paper')?.scrollIntoView({behavior:'smooth',block:'start'});break;case'source':openDrawer('来源与数据',`<p class="muted mt24">关联 ${esc(val)} · 设计示例</p><div class="notice amber mt16">${icon('info')}<div>当前数据仅为展示界面，没有经过事实核验。</div></div><h3 class="mt24">原文位置</h3><p class="muted mt8">“把投入、使用和回报分开，才能建立清晰的表达框架。”</p><hr class="divider"><h3>正式数据必须包含</h3><p class="muted mt8">来源名称、原始链接、观察日期、单位、币种、时区、调整口径与许可。</p><p class="muted mt24">正式实现复用现有数据来源与许可接口，不将 AI 生成内容标记为事实证据。</p>`);break;case'asset':openDrawer(esc(val),`<div class="mt24">${cover(2,'素材详情','16:9')}</div><div class="row mt24">${badge('设计示例','amber')}${badge('元数据随作品保留')}</div><div class="settings-row"><h4>来源</h4><span class="small muted">原型自制示意</span></div><div class="settings-row"><h4>证据属性</h4><span class="small muted">非事实证据</span></div><div class="settings-row"><h4>授权状态</h4><span class="small muted">生产环境须后端复核</span></div><button class="btn primary full mt24" data-action="demo-add">用于当前分镜</button>`);break;case'inspect':document.querySelectorAll('.inspector .segmented button').forEach(x=>x.classList.toggle('active',x===b));if(val==='source')actions['scene-info']();else if(val==='speech')actions['volume']();else toast('当前正在查看画面属性。');break;case'pack':openModal(`${esc(val)} · 按需启用`,`<p>正式启用前，应展示访问权限、使用范围、版本、费用与撤销方式。</p><div class="notice mt16">${icon('shield')}<div>这个操作只改变演示状态，不安装真实插件、不扣费。</div></div>`,btn('取消','close')+btn('加入当前演示',`install:${esc(val)}`,'primary'));break;case'install':if(!state.installed.includes(val))state.installed.push(val);closeLayer();render();toast('已加入演示状态；不是实际工作区安装。');break;case'provider':openModal(`${esc(val)} · 服务配置`,`<p>正式产品通过后端密钥保险库保存凭据，并执行能力核验。前端只显示掩码与检查状态。</p><div class="notice amber mt16">${icon('lock')}<div>请勿在原型中输入真实 API Key。本页面没有密钥输入框，也不保存任何凭据。</div></div><div class="settings-row mt16"><h4>连接状态</h4>${badge('未连接')}</div><div class="settings-row"><h4>能力核验</h4><span class="small muted">尚未执行</span></div>`);break;case'mode':document.querySelectorAll('.segmented button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('provider-mode-note').textContent=val==='byok'?'自有 API 模式：真实密钥只在生产环境后端安全接收。本原型不收集凭据。':'平台托管模式：根据后台可用能力路由，本原型没有真实托管额度。';break;case'setting':document.querySelectorAll('.setting-nav button').forEach(x=>x.classList.toggle('active',x===b));if(val==='0'){render();break}const titles=['','用量与预算','工作区与成员','安全与隐私','外观与偏好'];openModal(titles[Number(val)],val==='1'?`<p>订阅权益与 AI 计算费用分别呈现。正式版展示已用、预留、可用额度，以及逐任务用量账本。</p><div class="notice mt24">${icon('credit')}<div>未连接真实账单。原型不展示伪造的用户余额。</div></div>`:val==='2'?`<p>在这里管理工作区成员、角色和邀请。所有操作须复用服务端权限与席位约束。</p>`:val==='3'?`<p>身份授权、素材权限、隐私档位、保留期与访问记录集中管理。后台凭据不可进入浏览器。</p>`:`<p>浅色为默认，深色作为低光环境偏好。降低动态效果时停用动画。</p><div class="mt24">${btn('切换深浅色','theme','','sun')}</div>`);break;case'profile':document.querySelectorAll('.plan-option').forEach(x=>x.classList.toggle('selected',x===b));break;default:toast('此操作为设计演示入口。')}});
document.addEventListener('input',e=>{if(e.target.id==='command-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-command-label]').forEach(x=>x.classList.toggle('hide',!x.dataset.commandLabel.toLowerCase().includes(q)))}if(e.target.id==='asset-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-name]').forEach(x=>x.classList.toggle('hide',!x.dataset.name.toLowerCase().includes(q)))}});
document.addEventListener('focusout',e=>{if(e.target.id==='script-opening'){if(state.script!==e.target.textContent)state.approved=false;state.script=e.target.textContent;save()}if(e.target.id==='scene-heading'){state.approved=false;save();const h=document.querySelector('.viewer h2');if(h)h.textContent=e.target.value;toast('标题已更新到本地预览；未写入服务端。')}});
document.addEventListener('change',async e=>{if(e.target.id!=='source-file')return;const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return toast('原型仅读取 2 MB 以内的文本文件。');if(!/\.(txt|md)$/i.test(f.name))return toast('原型仅解析 .txt / .md；不伪造文档提取成功。');try{state.input=await f.text();save();const target=document.getElementById('file-result');target.textContent=`已在本地读取 ${f.name} · ${state.input.length.toLocaleString()} 字符，未上传。`;toast('已读取本地文本。后续脚本仍使用预置演示内容。')}catch{toast('读取失败，请重试。')}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command()}if(e.key==='Escape'){closeLayer();document.querySelector('.sidebar')?.classList.remove('mobile-open')}if(e.key==='Tab'&&document.getElementById('layer').innerHTML){const nodes=[...document.getElementById('layer').querySelectorAll('button,input,textarea,select,[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.addEventListener('hashchange',()=>{closeLayer();render()});render();
</script>
</body>
</html>
