name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ancs
          POSTGRES_PASSWORD: ancs
          POSTGRES_DB: ancs_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ancs -d ancs_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ANCS_TEST_DATABASE_URL: postgres://ancs:ancs@localhost:5432/ancs_dev
      ANCS_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify（secrets → lint → typecheck → build → arch:check → 测试套件）
        run: pnpm verify

      # P08-01：全新库部署演练（复用 verify 的构建产物；含错误配置 fail-closed 反向校验）
      - name: 部署演练（P08-01）
        run: pnpm run deploy:rehearsal
        env:
          ANCS_REHEARSAL_SKIP_BUILD: "1"

      # P08-03：备份/恢复演练（恢复到隔离库 → 读取并重渲染固定版本 → 密钥轮换断言）
      - name: 备份/恢复演练（P08-03）
        run: pnpm run recovery:rehearsal

      # P09-06：商业上线门校验（信息模式：台账可解析 + 机器条件输出；live 放行判定由运营在部署前执行）
      - name: 商业上线门（P09-06）
        run: pnpm run launch:gate
