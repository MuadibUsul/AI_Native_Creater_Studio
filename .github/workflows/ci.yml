name: CI

on:
  push:
    # V5 §19.3：长期开发分支直接推送也必须跑 CI
    branches: [main, 'codex/**']
  pull_request:

jobs:
  # V5-M4：全历史密钥扫描（已从工作树删除但仍留在历史中的凭据同样视为泄露）。纯 Node，无需安装依赖。
  secrets-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Secret scan（全部提交历史）
        run: node scripts/check-secrets.mjs --history

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ancs
          POSTGRES_PASSWORD: ancs
          POSTGRES_DB: ancs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ancs -d ancs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ANCS_TEST_DATABASE_URL: postgres://ancs:ancs@localhost:5432/ancs_test
      ANCS_TEST_REDIS_URL: redis://localhost:6379
      ANCS_TEST_S3_ENDPOINT: http://127.0.0.1:58333

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install FFmpeg
        # 真实媒体链路（探测/索引/转码、播放快照的真实解码校验）需要 ffmpeg/ffprobe；
        # unit 套件按仓库定义保持"无外部依赖"，因此这些用例归入 integration 套件。
        # 含 AI 生成内容的终渲染要画显式标识（GB 45438），需要一款中文字体；与 Worker 镜像（Dockerfile）同用 fonts-noto-cjk。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1
          ffprobe -version | head -1
          fc-list ':lang=zh-cn' file | grep -q . || { echo "no Chinese font visible to fontconfig" >&2; exit 1; }

      - name: Start S3-compatible storage (SeaweedFS)
        # S3 驱动的集成测试需要一个会校验 SigV4 签名（含预签名 URL）的真实 S3 兼容服务；服务容器无法传启动参数，故用 docker run
        run: |
          mkdir -p "$RUNNER_TEMP/seaweed"
          echo '{"identities":[{"name":"ancs","credentials":[{"accessKey":"ancs-test","secretKey":"ancs-test-secret-0000"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/seaweed/s3.json" # secrets:check-ignore：测试专用假密钥
          docker run -d --name ancs-s3 -p 58333:8333 -v "$RUNNER_TEMP/seaweed:/etc/seaweed-cfg:ro" chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweed-cfg/s3.json -dir=/data
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:58333/)" != "000" ] && break; sleep 1; done

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify（secrets → lint → typecheck → build → arch:check → 测试套件）
        run: pnpm verify

      # P08-01：全新库部署演练（复用 verify 的构建产物；含错误配置 fail-closed 反向校验）
      - name: 部署演练（P08-01）
        run: pnpm run deploy:rehearsal
        env:
          ANCS_REHEARSAL_SKIP_BUILD: "1"

      # P08-03：备份/恢复演练（恢复到隔离库 → 读取并重渲染固定版本 → 密钥轮换断言）
      - name: 备份/恢复演练（P08-03）
        run: pnpm run recovery:rehearsal

      # P09-06：商业上线门校验（信息模式：台账可解析 + 机器条件输出；live 放行判定由运营在部署前执行）
      - name: 商业上线门（P09-06）
        run: pnpm run launch:gate
